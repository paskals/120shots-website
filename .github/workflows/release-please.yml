name: Release Please

# Keeps a release PR open on main. It lists the feat/fix commits since the last
# release; merging it bumps the version, updates CHANGELOG.md and publishes the
# GitHub release. Commits that only touch src/content never count.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
