version: 2
updates:
  # Version updates go to develop, grouped into one PR per dependency type.
  # Major bumps are not grouped and get their own PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Security updates ignore `target-branch` and skip the commit-message prefix
  # of any entry that sets it. This entry has no `target-branch`, so security
  # PRs target the default branch with conventional prefixes. The PR limit of 0
  # turns off version-update PRs for this entry.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
